.btn:hover i{transform:rotate(45deg)}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn--line{padding:0 26px;background:none;color:var(--white);border:1px solid rgba(255,255,255,.4)}
.btn--line:hover{background:var(--white);color:var(--black)}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 24px;padding-top:22px;border-top:1px solid var(--line-d);font-size:16px;color:var(--g4)}
